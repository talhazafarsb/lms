apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: clone-build-push
spec:
  description: |
    This pipeline clones a git repo, builds a Docker image with Kaniko and
    pushes it to a registry    
  params:
  - name: repo-url
    type: string
  - name: revision
    type: string
  - name: image-reference
    type: string
  - name: DOCKERFILE
    type: string
  - name: CONTEXT
    type: string
  workspaces:
  - name: shared-data
  - name: docker-credentials
  tasks:
  - name: fetch-source
    taskRef:
      name: git-clone
    workspaces:
    - name: output
      workspace: shared-data
    params:
    - name: url
      value: $(params.repo-url)
    - name: revision
      value: $(params.revision)

  - name: copy-environment
    runAfter: ["fetch-source"]
    taskRef:
      name: copy-environment
    workspaces:
    - name: source
      workspace: shared-data

  - name: build-push-app
    runAfter: ["copy-environment"]
    taskRef:
      name: kaniko
    workspaces:
    - name: source
      workspace: shared-data
    - name: dockerconfig
      workspace: docker-credentials
    params:
    - name: IMAGE
      value: docker.io/talhazafarsb1/app:key
    - name: DOCKERFILE
      value: "Dockerfile-app"
    - name: CONTEXT
      value: .

  - name: build-push-nginx
    runAfter: ["build-push-app"]
    taskRef:
      name: kaniko
    workspaces:
    - name: source
      workspace: shared-data
    - name: dockerconfig
      workspace: docker-credentials
    params:
    - name: IMAGE
      value: docker.io/talhazafarsb1/nginx:key
    - name: DOCKERFILE
      value: "Dockerfile-nginx"
    - name: CONTEXT
      value: .
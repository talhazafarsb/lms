apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: clone-build-push
spec:
  description: |
    This pipeline clones a git repo, builds a Docker image with Kaniko and
    pushes it to a registry
  params:
  - name: repo-url
    type: string
  - name: image-reference
    type: string
  - name: revision
    type: string
  - name: DOCKERFILE
  - name: CONTEXT
  workspaces:
  - name: shared-data
  - name: docker-credentials
  tasks:
  - name: fetch-source
    taskRef:
      name: git-clone
    workspaces:
    - name: output
      workspace: shared-data
    params:
    - name: url
      value: $(params.repo-url)
    - name: revision
      value: $(params.revision)

  - name: copy-environment-file
    runAfter: ["fetch-source"]
    taskSpec:
      steps:
      - name: list-files
        image: alpine
        script: |
          #!/bin/sh
          echo "Listing contents of the cloned repo:"
          cd $(workspaces.source.path)
          cp .env.example .env
          ls -al $(workspaces.source.path)
          touch storage/logs/laravel.logs
    workspaces:
    - name: source
      workspace: shared-data

  - name: build-push-app
    runAfter: ["copy-environment-file"]
    taskRef:
      name: kaniko
    workspaces:
    - name: source
      workspace: shared-data
    - name: dockerconfig
      workspace: docker-credentials
    params:
    - name: IMAGE
      value: docker.io/talhazafarsb1/app:tkn
    - name: DOCKERFILE
      value: 'Dockerfile-app'
    - name: CONTEXT
      value: .

  - name: build-push-nginx
    runAfter: ["build-push-app"]
    taskRef:
      name: kaniko
    workspaces:
    - name: source
      workspace: shared-data
    - name: dockerconfig
      workspace: docker-credentials
    params:
    - name: IMAGE
      value: docker.io/talhazafarsb1/nginx:tkn
    - name: DOCKERFILE
      value: 'Dockerfile-nginx'
    - name: CONTEXT
      value: .    
